<template>
  <lightning-card title="Dynamic Process Panel" icon-name="standard:process">
    <div class="slds-m-around_medium">
      <template if:true={actions.length}>
        <template for:each={actions} for:item="action">
          <lightning-button
            key={action.name}
            label={action.label}
            data-name={action.name}
            onclick={handleActionClick}
            class="slds-m-right_small slds-m-bottom_small">
          </lightning-button>
        </template>
      </template>
      <template if:false={actions.length}>
        <p>No actions available.</p>
      </template>
    </div>

    <!-- Modal -->
    <template if:true={showModal}>
      <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <h2 id="modal-heading" class="slds-text-heading_medium">{currentAction.label}</h2>
            <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleModalClose}>
              <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
              <span class="slds-assistive-text">Close</span>
            </button>
          </header>

          <div class="slds-modal__content slds-p-around_medium">
            <template if:true={isCreateTask}>
              <lightning-input
                label="Subject"
                value={taskSubject}
                onchange={handleSubjectChange}
                class="slds-m-bottom_small">
              </lightning-input>

              <lightning-input
                type="date"
                label="Due Date"
                value={taskDueDate}
                onchange={handleDueDateChange}
                class="slds-m-bottom_small">
              </lightning-input>

              <lightning-button
                variant="brand"
                label="Create Task"
                onclick={handleCreateTask}>
              </lightning-button>
            </template>
            <template if:true={showViewOrders}>
              <c-view-orders-modal record-id={recordId}></c-view-orders-modal>
            </template>
            <template if:true={showViewCustomer}>
              <c-customer-modal record-id={recordId}></c-customer-modal>
            </template>

            <template if:true={showViewDocuments}>
              <c-documents-modal record-id={recordId}></c-documents-modal>
            </template>

            <template if:true={showViewHierarchy}>
              <c-hierarchy-modal record-id={recordId}></c-hierarchy-modal>
            </template>

            <template if:true={showViewTasks}>
              <c-view-tasks-modal record-id={recordId}></c-view-tasks-modal>
            </template>

            <template if:true={showViewEvents}>
              <c-view-events-modal record-id={recordId}></c-view-events-modal>
            </template>
            
          </div>

          <footer class="slds-modal__footer">
            <lightning-button label="Close" onclick={handleModalClose}></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </lightning-card>
</template>
